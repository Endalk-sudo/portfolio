<style>
:root {
  --bg: #090a09;
  --surface: #101310;
  --surface-card: #131713;
  --surface-border: #2c362c;
  --header-bg: #151915;
  --ink: #f5f8f5;          /* Crisp high-contrast ivory */
  --dim: #c8d6c8;          /* High-readability bright silver-green */
  --faint: #8da08d;        /* Legible tertiary text */
  --accent: #ffc233;       /* Vibrant retro amber */
  --accent-dim: rgba(255, 194, 51, 0.15);
  --green: #4ade80;        /* Terminal phosphor green */
  --blue: #60a5fa;         /* Retro cyan/blue */
  --red: #f87171;
  --yellow: #facc15;
  --purple: #c084fc;
  --pixel: 'Silkscreen', monospace;
  --mono: 'IBM Plex Mono', 'VT323', ui-monospace, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

::selection {
  background: var(--accent);
  color: #000;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow: hidden;
  background-color: #090a09;
  background-image: radial-gradient(#182018 1px, transparent 1px);
  background-size: 8px 8px;
}

/* Pixel Terminal Window Frame */
.terminal-window {
  width: 100%;
  max-width: 980px;
  height: calc(100vh - 32px);
  background: var(--surface);
  border: 3px solid var(--surface-border);
  box-shadow: 
    6px 6px 0px #000,
    0 0 0 1px #384638;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Pixel Header Bar */
.terminal-header {
  height: 48px;
  background: var(--header-bg);
  border-bottom: 3px solid var(--surface-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  user-select: none;
  flex-shrink: 0;
  gap: 12px;
}

.window-controls {
  display: flex;
  align-items: center;
  gap: 7px;
}

/* Square Pixel Dots */
.win-dot {
  width: 11px;
  height: 11px;
  display: inline-block;
  box-shadow: 1px 1px 0px #000;
}
.win-dot.close { background: var(--red); }
.win-dot.min   { background: var(--yellow); }
.win-dot.max   { background: var(--green); }

.terminal-title {
  color: var(--accent);
  font-family: var(--pixel);
  font-size: 11.5px;
  letter-spacing: 1px;
  white-space: nowrap;
  margin-left: 6px;
  text-transform: uppercase;
}

.header-shortcuts {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}
.header-shortcuts::-webkit-scrollbar { display: none; }

/* Pixel Buttons */
.shortcut-btn {
  background: #141714;
  color: var(--dim);
  border: 2px solid #283028;
  padding: 4px 9px;
  font-family: var(--pixel);
  font-size: 11px;
  cursor: pointer;
  box-shadow: 2px 2px 0px #000;
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.05s steps(2);
}
.shortcut-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: #1c211c;
}
.shortcut-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0px 0px 0px #000;
}
.shortcut-btn.btn-cv {
  color: var(--accent);
  border-color: rgba(255, 194, 51, 0.7);
}

/* Terminal Body */
.terminal-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  cursor: text;
  scroll-behavior: smooth;
  display: flex;
  flex-direction: column;
}
.terminal-body::-webkit-scrollbar {
  width: 10px;
}
.terminal-body::-webkit-scrollbar-track {
  background: #0d0f0d;
}
.terminal-body::-webkit-scrollbar-thumb {
  background: #283028;
  border: 1px solid #000;
}

.term-entry {
  margin-bottom: 22px;
}

.prompt-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 16px;
  font-weight: 500;
}
.prompt-user { color: var(--green); font-weight: 600; }
.prompt-host { color: var(--dim); }
.prompt-path { color: var(--blue); }
.prompt-char { color: var(--accent); font-weight: 600; }
.prompt-cmd  { color: var(--ink); font-weight: 600; }

.term-output {
  color: var(--ink);
}

/* Pixel Banner & Stat Badges */
.ascii-banner {
  color: var(--accent);
  font-family: 'VT323', monospace;
  font-size: 15px;
  line-height: 1.15;
  white-space: pre;
  margin-bottom: 14px;
  user-select: none;
  text-shadow: 2px 2px 0px #000;
}

/* Stat Counters Row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.stat-chip {
  background: var(--surface-card);
  border: 2px solid var(--surface-border);
  box-shadow: 2px 2px 0 #000;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
}
.stat-label {
  font-family: var(--pixel);
  font-size: 10.5px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 3px;
}
.stat-val {
  color: var(--accent);
  font-family: var(--pixel);
  font-size: 12px;
}
.stat-chip.highlight .stat-val {
  color: var(--green);
}

.banner-box {
  border: 2px solid var(--accent);
  background: rgba(255, 194, 51, 0.05);
  box-shadow: 4px 4px 0px #000;
  padding: 16px 18px;

}
.banner-name {

}
.banner-role {

  font-size: 16px;

  margin-bottom: 8px;
}
.banner-desc {

  font-size: 15px;
  line-height: 1.6;

}
.banner-avail {
  display: inline-block;
  background: #142814;
  color: var(--green);
  border: 2px solid var(--green);
  box-shadow: 2px 2px 0px #000;
  padding: 4px 10px;
  font-family: var(--pixel);
  font-size: 11px;
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Section Header */
.sec-title {
  color: var(--accent);
  font-family: var(--pixel);
  font-size: 13.5px;
  letter-spacing: 0.5px;

/* Pixel Project Cards */
.proj-card {

}
.proj-card:hover {

}
.proj-title-row {
  display: flex;

}
.proj-name {

}
.proj-year {

}
.status-pill {

.status-pill.live {

}
.status-pill.stable {

.proj-outcome {

.proj-tags {

.proj-actions {

/* Action Badges */
.badge-demo {

.badge-repo {

/* Visual Skills Matrix */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 12px;
  margin: 12px 0 16px 0;

.skill-box {

.skill-cat {

.skill-cat.lang { color: var(--yellow); }

/* Contact List */
.contact-list {

.copy-badge:hover {

/* Clickable Quick Command Chips directly above Prompt */
.prompt-chips-bar {
  display: flex;

.chip-btn {

  color: var(--ink);
  border: 1.5px solid #2e3a2e;
  box-shadow: 2px 2px 0px #000;

  cursor: pointer;

.chip-btn:hover {

.chip-btn:active {
  transform: translate(1px, 1px);
  box-shadow: 0px 0px 0px #000;

/* Active Prompt & Input */
.active-prompt {
  display: flex;
  align-items: center;
  position: relative;
  margin-top: 10px;
}
.input-wrap {
  flex: 1;

  align-items: center;

#term-input {
  width: 100%;
  background: transparent;
  border: none;

  color: var(--ink);
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 500;

/* Help Table */
.help-table {

.help-cmd {

}
.help-cmd:hover { color: #fff; text-shadow: 0 0 4px var(--accent); }
.help-desc { color: var(--dim); }

@media (max-width: 640px) {
  body { padding: 0; }
  .terminal-window {
    height: 100vh;

  .terminal-title { display: none; }
  .ascii-banner { font-size: 11px; overflow-x: auto; }
  .stats-row { grid-template-columns: 1fr; }

</style>

<script>
const CFG = (window.SITE && window.SITE.profile) || {
  name: 'Endalkachew Yaregal',
  role: 'software engineering student',
  email: 'endalkachewyaregal747@gmail.com',
  github: 'https://github.com/Endalk-sudo',
  githubLabel: 'github.com/Endalk-sudo',
  linkedin: 'https://www.linkedin.com/in/endalkachew-yaregal-swe',
  linkedinLabel: 'linkedin.com/in/endalkachew-yaregal-swe',
  cv: './Endalkachew_Yaregal_CV.pdf',
  cvLabel: 'Endalkachew_Yaregal_CV.pdf',
  location: 'Addis Ababa, Ethiopia',
  education: { school: 'Woldia University', degree: 'BSc Software Engineering', period: 'in progress' },
  availability: 'Open to a 4-month software engineering internship starting February 2027 (onsite or hybrid)'
};
const PROJECTS = (window.SITE && window.SITE.projects) || [];
const STACK_TOML = (window.SITE && window.SITE.stackToml) || '';

const termHistory = document.getElementById('term-history');
const termBody = document.getElementById('term-body');
const termInput = document.getElementById('term-input');

let cmdHistory = [];
let historyIndex = -1;

function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function focusInput() {
  termInput.focus();
}

function scrollToBottom() {
  termBody.scrollTop = termBody.scrollHeight;
}

function printEntry(cmd, outputHtml) {
  const entry = document.createElement('div');
  entry.className = 'term-entry';
  entry.innerHTML = `
    <div class="prompt-line">
      <span class="prompt-user">visitor</span><span class="prompt-host">@dev-box</span><span class="prompt-char">:</span><span class="prompt-path">~</span><span class="prompt-char">$</span>
      <span class="prompt-cmd">${esc(cmd)}</span>
    </div>
    <div class="term-output">${outputHtml}</div>
  `;
  termHistory.appendChild(entry);
  scrollToBottom();
}

function renderProjectCard(p) {
  const st = p.status || 'stable';
  const tags = (p.stack || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const actions = [];
  if (p.url) actions.push(`<a class="badge-demo" href="${esc(p.url)}" target="_blank" rel="noopener">● LIVE DEMO ↗</a>`);
  if (p.repo) actions.push(`<a class="badge-repo" href="${esc(p.repo)}" target="_blank" rel="noopener">★ GITHUB ↗</a>`);
  actions.push(`<button class="badge-details" onclick="runCmd('open ${esc(p.slug)}')">🔍 DETAILS</button>`);

  return `
    <article class="proj-card">
      <div class="proj-title-row">
        <span class="proj-name">${esc(p.name)} <span class="proj-year">(${esc(p.year)})</span></span>
        <span class="status-pill ${st}">${esc(st)}</span>
      </div>
      <p class="proj-outcome">${esc(p.outcome || p.blurb)}</p>
      <div class="proj-tags">${tags}</div>
      <div class="proj-actions">${actions.join('')}</div>
    </article>
  `;
}

/* Boot Dashboard: Shows key stats & top 2 projects immediately */

function cmdOpen(slug) {
  if (!slug) return '<p style="color:var(--red);">Usage: open &lt;project-slug&gt; (e.g. <code>open feedwise</code>)</p>';
  const p = PROJECTS.find(item => item.slug.toLowerCase() === slug.toLowerCase());
  if (!p) {
    return `<p style="color:var(--red);">Project "${esc(slug)}" not found. Run <span class="help-cmd" onclick="runCmd('projects')">projects</span> to see all slugs.</p>`;
  }

  const tags = (p.stack || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const highlights = (p.highlights || []).map(h => `<li style="margin: 5px 0;">${esc(h)}</li>`).join('');
  const actions = [];
  if (p.url) actions.push(`<a class="badge-demo" href="${esc(p.url)}" target="_blank" rel="noopener">● LIVE DEMO ↗</a>`);
  if (p.repo) actions.push(`<a class="badge-repo" href="${esc(p.repo)}" target="_blank" rel="noopener">★ GITHUB ↗</a>`);

  return `
    <div style="border: 2px solid var(--accent); box-shadow: 3px 3px 0 #000; padding: 16px 18px; background: var(--surface-card); max-width: 760px;">
      <h3 style="color:var(--accent); font-family:var(--pixel); font-size:14px; margin-bottom: 8px;">${esc(p.name)} <span class="proj-year">(${esc(p.year)})</span></h3>

      <div class="proj-actions" style="margin-top:14px;">${actions.join('')}</div>
    </div>
  `;
}

/* Dispatcher */
function runCmd(raw) {
  const line = (raw || '').trim();
  if (!line) return;

  cmdHistory.push(line);
  historyIndex = cmdHistory.length;

  const parts = line.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');

  if (cmd === 'clear') {
    termHistory.innerHTML = '';
    if (window.history && history.replaceState) {
      history.replaceState(null, '', window.location.pathname);
    }
    return;
  }

  if (['about', 'projects', 'stack', 'contact'].includes(cmd) && window.history && history.replaceState) {
    history.replaceState(null, '', '#' + cmd);
  }

  let out = '';
  switch (cmd) {
    case 'help':
      out = cmdHelp();
      break;
    case 'about':
    case 'whoami':
      out = cmdAbout();
      break;
    case 'projects':
    case 'ls':
      out = cmdProjects();
      break;
    case 'open':
    case 'project':
    case 'cat':
      out = cmdOpen(arg);
      break;
    case 'stack':
    case 'skills':
      out = cmdStack();
      break;
    case 'contact':
    case 'email':
      out = cmdContact();
      break;
    case 'cv':
      out = cmdCv();
      break;
    default:
      out = `<p style="color:var(--red);">command not found: <code>${esc(cmd)}</code>. Type <span class="help-cmd" onclick="runCmd('help')">help</span> for available commands.</p>`;
  }

  printEntry(line, out);
}

/* Key Event Listeners: Enter, History, Tab Completion */
termInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = termInput.value;
    termInput.value = '';
    runCmd(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      termInput.value = cmdHistory[historyIndex] || '';
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < cmdHistory.length - 1) {
      historyIndex++;
      termInput.value = cmdHistory[historyIndex] || '';
    } else {
      historyIndex = cmdHistory.length;
      termInput.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = termInput.value.trim().toLowerCase();
    const cmds = ['help', 'about', 'projects', 'stack', 'contact', 'cv', 'clear'];
    const projectSlugs = PROJECTS.map(p => p.slug);

    if (val.startsWith('open ')) {
      const slugPrefix = val.slice(5).trim();
      const match = projectSlugs.find(s => s.startsWith(slugPrefix));
      if (match) termInput.value = 'open ' + match;
    } else if (val) {
      const match = cmds.find(c => c.startsWith(val));
      if (match) termInput.value = match;
    }
  }
});

/* Init */
printWelcome();

// Support deep links like #projects, #about, #contact
if (typeof window !== 'undefined' && window.addEventListener) {
  const handleHash = () => {
    const hash = (window.location.hash || '').replace('#', '').trim().toLowerCase();
    if (hash && ['about', 'projects', 'stack', 'contact', 'cv'].includes(hash)) {
      runCmd(hash);
    }
  };
  window.addEventListener('DOMContentLoaded', handleHash);
  window.addEventListener('hashchange', handleHash);
}
