<style>
/* ============================================================
   RESET & DESIGN TOKENS
============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Surfaces */
  --bg:            #0a0c0a;
  --surface:       #0e110e;
  --card:          #121612;
  --card-hover:    #161c16;
  --footer-bg:     #0b0e0b;

  /* Borders */
  --border:        #232b23;
  --border-strong: #3a463a;

  /* Text — clear hierarchy */
  --ink-bright: #f4f7f4;
  --ink:        #d8dfd8;
  --muted:      #94a494;
  --faint:      #637363;

  /* Accent & semantics */
  --accent:      #ffc233;
  --accent-dim:  rgba(255, 194, 51, 0.12);
  --accent-brd:  rgba(255, 194, 51, 0.35);
  --green:       #4ade80;
  --green-dim:   rgba(74, 222, 128, 0.10);
  --green-brd:   rgba(74, 222, 128, 0.30);
  --blue:        #60a5fa;
  --blue-dim:    rgba(96, 165, 250, 0.10);
  --blue-brd:    rgba(96, 165, 250, 0.30);
  --red:         #f87171;
  --yellow:      #facc15;

  /* Fonts */
  --pixel: 'Space Mono', ui-monospace, 'Courier New', monospace;
  --mono:  'JetBrains Mono', ui-monospace, 'Courier New', monospace;
}

::selection { background: var(--accent); color: #000; }

/* Focus rings for keyboard users (a11y) */
a:focus-visible,
button:focus-visible,
input:focus-visible {
  outline: 1px solid var(--accent);
  outline-offset: 2px;
}
#term-input:focus-visible { outline: none; }

html {
  font-size: 15px;
  /* Prevent iOS Safari text-size-adjust on landscape rotate */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  /* Use dvh on modern browsers so URL bar doesn't overlap; fallback to vh */
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--bg);
  background-image: radial-gradient(circle at center, #121612 1px, transparent 1px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--mono);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  /* Prevent accidental horizontal overflow on phones */
  overscroll-behavior: none;
}

/* ============================================================
   TERMINAL WINDOW
============================================================ */
.terminal-window {
  width: 100%;
  max-width: 900px;
  height: calc(100vh - 32px);
  height: calc(100dvh - 32px); /* prefer dvh */
  max-height: 900px;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 2px solid var(--border);
  box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.55), 0 0 0 1px #141a14;
  overflow: hidden;
}

/* -------- Header -------- */
.terminal-header {
  flex-shrink: 0;
  height: 44px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: #141a14;
  border-bottom: 1px solid var(--border);
  user-select: none;
}

.window-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.win-dot {
  width: 10px;
  height: 10px;
  display: inline-block;
  box-shadow: 1px 1px 0 #000;
}
.win-dot.close { background: var(--red); }
.win-dot.min   { background: var(--yellow); }
.win-dot.max   { background: var(--green); }

.terminal-title {
  font-family: var(--pixel);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.4px;
  color: var(--accent);
  white-space: nowrap;
  margin-left: 4px;
}

.header-spacer { flex: 1; }

.header-cv {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 11px;
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2px;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--accent);
  background: var(--accent-dim);
  border: 1px solid var(--accent-brd);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.header-cv:hover { background: var(--accent); color: #000; }

/* -------- Scrollable body -------- */
.terminal-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 26px 32px;
  cursor: text;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.terminal-body::-webkit-scrollbar { width: 8px; }
.terminal-body::-webkit-scrollbar-track { background: transparent; }
.terminal-body::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}
.terminal-body::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

/* -------- Fixed footer -------- */
.terminal-footer {
  flex-shrink: 0;
  padding: 10px 16px 12px;
  background: var(--footer-bg);
  border-top: 1px solid var(--border);
}

.quick-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 9px;
}

.qa-label {
  font-family: var(--pixel);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--faint);
  letter-spacing: 0.4px;
  margin-right: 2px;
}

.qa-btn {
  padding: 3px 9px;
  font-family: var(--pixel);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1px;
  text-transform: uppercase;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.qa-btn:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-dim);
}

.qa-hint {
  margin-left: auto;
  font-family: var(--pixel);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1px;
  color: var(--faint);
  white-space: nowrap;
}
.qa-hint b {
  color: var(--muted);
  font-weight: 700;
}

.prompt-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.prompt-label {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
}
.p-user  { color: var(--green); }
.p-host  { color: var(--muted); }
.p-colon { color: var(--muted); }
.p-path  { color: var(--blue); }
.p-char  { color: var(--accent); margin-left: 2px; }

#term-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--ink-bright);
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 500;
  padding: 0;
  caret-color: var(--accent);
}

/* ============================================================
   CONTENT BLOCKS
============================================================ */

.hero {
  padding-bottom: 24px;
  border-bottom: 1px dashed var(--border);
  margin-bottom: 26px;
}

.hero-eyebrow {
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--accent);
  margin-bottom: 10px;
}

.hero-name {
  font-size: clamp(24px, 4.5vw, 32px);
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: var(--ink-bright);
  margin-bottom: 6px;
}

.hero-role {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 16px;
}

.hero-tagline {
  font-size: 15px;
  line-height: 1.65;
  color: var(--ink);
  max-width: 640px;
  margin-bottom: 18px;
}

.hero-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2px;
  color: var(--green);
  background: var(--green-dim);
  border: 1px solid var(--green-brd);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.4; }
}

@media (prefers-reduced-motion: reduce) {
  .status-dot { animation: none; }
  .terminal-body { scroll-behavior: auto; }
}

.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 28px 0 16px;
}

.section-title {
  font-family: var(--pixel);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--accent);
}

.link-btn {
  background: transparent;
  border: none;
  padding: 2px 0;
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2px;
  text-transform: uppercase;
  color: var(--accent);
  cursor: pointer;
  transition: color 0.15s;
  white-space: nowrap;
}
.link-btn:hover { color: var(--ink-bright); }

/* -------- Project cards -------- */
.project-grid {
  display: grid;
  gap: 14px;
}

.proj-card {
  padding: 16px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  transition: border-color 0.2s, background 0.2s;
  min-width: 0; /* allow shrink in grid */
}
.proj-card:hover {
  border-color: var(--border-strong);
  background: var(--card-hover);
}

.proj-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.proj-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-bright);
  letter-spacing: -0.01em;
  overflow-wrap: break-word;
}

.proj-year {
  font-size: 11.5px;
  font-weight: 400;
  color: var(--faint);
  margin-left: 8px;
  letter-spacing: 0;
}

.proj-status {
  font-family: var(--pixel);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  padding: 2px 8px;
  flex-shrink: 0;
}
.proj-status.live {
  color: var(--green);
  background: var(--green-dim);
  border: 1px solid var(--green-brd);
}
.proj-status.stable {
  color: var(--blue);
  background: var(--blue-dim);
  border: 1px solid var(--blue-brd);
}

.proj-outcome {
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink);
  margin-bottom: 12px;
  overflow-wrap: break-word;
}

.proj-stack {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 14px;
}

.stack-tag {
  font-family: var(--pixel);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1px;
  text-transform: uppercase;
  color: var(--muted);
  background: #1a211a;
  border: 1px solid var(--border);
  padding: 2px 7px;
}

.proj-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.proj-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 11px;
  font-family: var(--pixel);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  text-transform: uppercase;
  text-decoration: none;
  border: 1px solid;
  cursor: pointer;
  transition: all 0.15s;
  background: transparent;
}
.proj-link.live {
  color: var(--green);
  border-color: var(--green-brd);
  background: var(--green-dim);
}
.proj-link.live:hover { background: var(--green); color: #000; }
.proj-link.repo {
  color: var(--blue);
  border-color: var(--blue-brd);
  background: var(--blue-dim);
}
.proj-link.repo:hover { background: var(--blue); color: #000; }
.proj-link.details {
  color: var(--muted);
  border-color: var(--border-strong);
}
.proj-link.details:hover { color: var(--accent); border-color: var(--accent); }

.welcome-hint {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px dashed var(--border);
  font-size: 13px;
  color: var(--faint);
}

kbd {
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1px;
  color: var(--accent);
  background: var(--accent-dim);
  border: 1px solid var(--accent-brd);
  padding: 1px 6px;
}

.term-entry {
  margin-bottom: 24px;
}

.cmd-line {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  margin-bottom: 12px;
  color: var(--muted);
  flex-wrap: wrap;
}
.cmd-line .cmd {
  color: var(--ink-bright);
  font-weight: 500;
  overflow-wrap: anywhere;
}

.cmd-intro {
  font-size: 14px;
  line-height: 1.65;
  color: var(--muted);
  max-width: 640px;
  margin-bottom: 12px;
  overflow-wrap: break-word;
}

.cmd-lead {
  font-size: 15px;
  line-height: 1.65;
  color: var(--ink);
  max-width: 700px;
  margin-bottom: 6px;
  overflow-wrap: break-word;
}
.cmd-lead strong { color: var(--ink-bright); font-weight: 600; }

.cmd-sub {
  font-size: 14px;
  line-height: 1.65;
  color: var(--muted);
  max-width: 700px;
  margin-bottom: 14px;
  overflow-wrap: break-word;
}

.help-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px 22px;
  align-items: baseline;
  max-width: 600px;
  margin: 8px 0;
}
.help-cmd {
  display: inline;
  background: none;
  border: none;
  padding: 0;
  font-family: var(--pixel);
  font-size: 11.5px;
  font-weight: 700;
  line-height: inherit;
  letter-spacing: 0.1px;
  text-transform: uppercase;
  text-align: left;
  color: var(--accent);
  cursor: pointer;
}
.help-cmd:hover { color: var(--ink-bright); }
.help-desc { color: var(--muted); font-size: 14px; line-height: 1.5; overflow-wrap: break-word; }

.help-tip {
  color: var(--faint);
  font-size: 13px;
  margin-top: 12px;
}

.info-panel {
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 14px;
  line-height: 1.7;
  margin-top: 14px;
  max-width: 700px;
  overflow-wrap: break-word;
}
.info-panel p { margin-bottom: 6px; }
.info-panel p:last-child { margin-bottom: 0; }
.info-label {
  font-family: var(--pixel);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-right: 8px;
}

/* -------- Spec list (shared by stack & contact) -------- */
.spec-list {
  max-width: 720px;
  margin: 4px 0;
  background: var(--card);
  border: 1px solid var(--border);
}

.spec-row {
  display: grid;
  grid-template-columns: 128px 1fr auto;
  gap: 16px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.spec-row:last-child { border-bottom: none; }

.spec-key {
  font-family: var(--pixel);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--accent);
}

.spec-val {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink);
  overflow-wrap: anywhere;
  min-width: 0;
}

.contact-link {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 1px;
  transition: border-color 0.15s;
  overflow-wrap: anywhere;
}
.contact-link:hover { border-bottom-color: currentColor; }
.contact-link.primary { color: var(--green); }
.contact-link .arr { color: var(--faint); margin-left: 3px; }

.copy-btn {
  min-width: 64px;
  padding: 2px 9px;
  font-family: var(--pixel);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1px;
  text-transform: uppercase;
  text-align: center;
  color: var(--accent);
  background: var(--accent-dim);
  border: 1px solid var(--accent-brd);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.copy-btn:hover { background: var(--accent); color: #000; }

/* -------- Detail view -------- */
.detail-card {
  max-width: 760px;
  padding: 18px 20px;
  background: var(--card);
  border: 1px solid var(--accent-brd);
  overflow-wrap: break-word;
}

.detail-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.detail-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--ink-bright);
  letter-spacing: -0.01em;
}
.detail-year {
  font-size: 13px;
  color: var(--faint);
}

.detail-outcome {
  font-size: 15px;
  font-weight: 500;
  line-height: 1.6;
  color: var(--ink);
  margin-bottom: 10px;
}
.detail-desc {
  font-size: 14px;
  line-height: 1.65;
  color: var(--muted);
  margin-bottom: 14px;
}

.detail-h4 {
  font-family: var(--pixel);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}

.detail-highlights {
  list-style: none;
  margin-bottom: 16px;
}
.detail-highlights li {
  position: relative;
  padding-left: 16px;
  margin-bottom: 6px;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--muted);
  overflow-wrap: break-word;
}
.detail-highlights li::before {
  content: '▸';
  position: absolute;
  left: 0;
  color: var(--accent);
}

/* ============================================================
   RESPONSIVE — TABLET (641–900px)
   Single-column, wider window border preserved.
============================================================ */
@media (max-width: 900px) and (min-width: 641px) {
  .terminal-body { padding: 22px 22px 28px; }
  .proj-card { padding: 15px 16px; }
}

/* ============================================================
   RESPONSIVE — MOBILE (≤640px)
   Full-bleed terminal, larger touch targets, iOS zoom fix.
============================================================ */
@media (max-width: 640px) {
  body {
    padding: 0;
    background-image: none;
  }

  .terminal-window {
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border: none;
    box-shadow: none;
    /* Account for notch/home indicator when running full-screen */
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .terminal-header {
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
  }
  .terminal-title { display: none; }

  .terminal-body { padding: 18px 16px 24px; }

  /* Bigger tap targets: qa-btn, proj-link, copy-btn, header-cv, help-cmd */
  .qa-btn {
    padding: 7px 10px;
    font-size: 10.5px;
    min-height: 34px;
  }
  .proj-link {
    padding: 9px 13px;
    min-height: 40px;
    font-size: 11px;
  }
  .copy-btn {
    padding: 6px 11px;
    min-height: 34px;
    font-size: 10.5px;
  }
  .header-cv {
    padding: 7px 13px;
    min-height: 34px;
    font-size: 11px;
  }
  .help-cmd {
    padding: 8px 0;
    display: inline-block;
  }
  .help-grid { grid-template-columns: 1fr; gap: 2px; }

  /* Prevent iOS zoom-on-focus: any input must be ≥16px */
  #term-input { font-size: 16px; }

  .hero-name { font-size: 22px; }
  .hero-tagline { font-size: 14px; }
  .hero-status { font-size: 10.5px; padding: 6px 11px; }

  .proj-head { flex-direction: column; align-items: flex-start; gap: 6px; }
  .proj-name { font-size: 15px; }

  .section-header { flex-wrap: wrap; }
  .qa-hint { display: none; }

  .spec-row { gap: 12px; }

  .detail-card { padding: 14px 16px; }
}

/* ============================================================
   RESPONSIVE — SMALL PHONE (≤520px)
   Spec rows stack the key on its own line.
============================================================ */
@media (max-width: 520px) {
  .spec-row {
    grid-template-columns: 1fr auto;
    gap: 3px 12px;
    padding: 11px 14px;
  }
  .spec-key {
    grid-column: 1 / -1;
    margin-bottom: 2px;
  }
}

/* ============================================================
   RESPONSIVE — VERY SMALL PHONE (≤380px)
   Galaxy Fold, iPhone SE 1st-gen, etc.
============================================================ */
@media (max-width: 380px) {
  .terminal-body { padding: 16px 14px 20px; }
  .terminal-footer { padding-left: 12px; padding-right: 12px; }

  .hero-name { font-size: 20px; }
  .hero-tagline { font-size: 13.5px; }
  .hero-role { font-size: 13px; }

  .qa-label { display: none; }
  .qa-btn { padding: 6px 8px; font-size: 10px; }

  .proj-name { font-size: 14.5px; }
  .proj-card { padding: 13px 14px; }

  .section-title { font-size: 11px; }

  .spec-row { padding: 10px 12px; }
  .spec-key { font-size: 10px; }
  .spec-val { font-size: 13px; }

  .detail-card { padding: 12px 14px; }
  .detail-name { font-size: 16px; }
}

/* ============================================================
   RESPONSIVE — LANDSCAPE PHONE (short viewport, tall not)
   Compress vertical rhythm to maximize scrollable area.
============================================================ */
@media (max-height: 500px) and (orientation: landscape) {
  body { padding: 0; background-image: none; }

  .terminal-window {
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border: none;
    box-shadow: none;
  }

  .terminal-header { height: 38px; }
  .terminal-title { display: none; }

  .terminal-body { padding: 14px 22px 18px; }

  .hero { padding-bottom: 14px; margin-bottom: 16px; }
  .hero-name { font-size: 22px; }
  .hero-tagline { font-size: 14px; margin-bottom: 12px; }
  .hero-status { font-size: 10.5px; padding: 5px 10px; }

  .section-header { margin: 18px 0 12px; }
  .term-entry { margin-bottom: 18px; }

  .terminal-footer { padding: 8px 14px 10px; }
  .quick-actions { margin-bottom: 6px; }
  .qa-btn { padding: 5px 9px; min-height: 30px; }
  .qa-hint { display: none; }

  #term-input { font-size: 16px; }
}

/* ============================================================
   A11Y — Disable animations if the user prefers reduced motion
============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<div class="terminal-window">
  <header class="terminal-header">
    <div class="window-controls">
      <span class="win-dot close"></span>
      <span class="win-dot min"></span>
      <span class="win-dot max"></span>
      <span class="terminal-title">endalk@dev-box: ~</span>
    </div>
    <div class="header-spacer"></div>
    <a class="header-cv" href="./Endalkachew_Yaregal_CV.pdf" target="_blank" rel="noopener">↓ Download CV</a>
  </header>

  <main class="terminal-body" id="term-body">
    <div id="term-history"></div>
  </main>

  <footer class="terminal-footer">
    <div class="quick-actions">
      <span class="qa-label">QUICK:</span>
      <button class="qa-btn" onclick="runCmd('projects')">projects</button>
      <button class="qa-btn" onclick="runCmd('stack')">stack</button>
      <button class="qa-btn" onclick="runCmd('about')">about</button>
      <button class="qa-btn" onclick="runCmd('contact')">contact</button>
      <button class="qa-btn" onclick="runCmd('help')">help</button>
      <button class="qa-btn" onclick="runCmd('clear')">clear</button>
      <span class="qa-hint"><b>↑↓</b> history · <b>Tab</b> complete</span>
    </div>
    <div class="prompt-row">
      <span class="prompt-label">
        <span class="p-user">visitor</span><span class="p-host">@dev-box</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-char">$</span>
      </span>
      <input id="term-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Terminal command input" autofocus>
    </div>
  </footer>
</div>

<script src="./config.js"></script>
<script>
/* ============================================================
   CONFIG & STATE
============================================================ */
const CFG = (window.SITE && window.SITE.profile) || {
  name: 'Endalkachew Yaregal',
  role: 'software engineering student',
  email: 'endalkachewyaregal747@gmail.com',
  github: 'https://github.com/Endalk-sudo',
  githubLabel: 'github.com/Endalk-sudo',
  linkedin: 'https://www.linkedin.com/in/endalkachew-yaregal-swe',
  linkedinLabel: 'linkedin.com/in/endalkachew-yaregal-swe',
  cv: './Endalkachew_Yaregal_CV.pdf',
  cvLabel: 'Endalkachew_Yaregal_CV.pdf',
  location: 'Addis Ababa, Ethiopia',
  tagline: 'I build production full-stack systems — background queues, AI integrations, payment webhooks, and performant APIs.',
  availability: 'Open to a 4-month software engineering internship starting February 2027 (onsite or hybrid)',
  availabilityShort: 'Open to a 4-month internship · Feb 2027',
  education: { school: 'Woldia University', degree: 'BSc Software Engineering', period: 'in progress' },
  skills: {}
};
const PROJECTS = (window.SITE && window.SITE.projects) || [];

const termHistory = document.getElementById('term-history');
const termBody    = document.getElementById('term-body');
const termInput   = document.getElementById('term-input');

/* Detect touch / coarse pointer — used to skip auto-focus & click-to-focus
   on mobile so the on-screen keyboard doesn't pop up on scroll. */
const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

let cmdHistory = [];
let historyIndex = -1;

/* ============================================================
   HELPERS
============================================================ */
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function focusInput() {
  /* Never auto-focus on touch — it opens the keyboard & shifts the layout. */
  if (isTouch) return;
  termInput.focus();
}

function scrollToBottom() {
  termBody.scrollTop = termBody.scrollHeight;
}

function maybeFocus(e) {
  /* On touch, only focus if the user taps the input itself (handled by the browser). */
  if (isTouch) return;
  if (e.target.closest('a, button, input')) return;
  termInput.focus();
}

function copyEmail(btn) {
  if (!navigator.clipboard) { alert('Email: ' + CFG.email); return; }
  navigator.clipboard.writeText(CFG.email).then(() => {
    const orig = btn.textContent;
    btn.textContent = 'COPIED';
    setTimeout(() => { btn.textContent = orig; }, 1600);
  }).catch(() => alert('Email: ' + CFG.email));
}

/* ============================================================
   RENDERERS
============================================================ */
function renderProjectCard(p) {
  const st = p.status || 'stable';
  const tags = (p.stack || []).slice(0, 6)
    .map(t => `<span class="stack-tag">${esc(t)}</span>`).join('');
  const actions = [];
  if (p.url)  actions.push(`<a class="proj-link live" href="${esc(p.url)}" target="_blank" rel="noopener">● Live Demo ↗</a>`);
  if (p.repo) actions.push(`<a class="proj-link repo" href="${esc(p.repo)}" target="_blank" rel="noopener">GitHub ↗</a>`);
  actions.push(`<button class="proj-link details" onclick="runCmd('open ${esc(p.slug)}')">Details</button>`);

  return `
    <article class="proj-card">
      <div class="proj-head">
        <h3 class="proj-name">${esc(p.name)}<span class="proj-year">${esc(p.year)}</span></h3>
        <span class="proj-status ${st}">${esc(st)}</span>
      </div>
      <p class="proj-outcome">${esc(p.outcome || p.blurb)}</p>
      <div class="proj-stack">${tags}</div>
      <div class="proj-links">${actions.join('')}</div>
    </article>
  `;
}

function printEntry(cmd, outputHtml) {
  const entry = document.createElement('div');
  entry.className = 'term-entry';
  entry.innerHTML = `
    <div class="cmd-line">
      <span class="p-user">visitor</span><span class="p-host">@dev-box</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-char">$</span>
      <span class="cmd">${esc(cmd)}</span>
    </div>
    <div class="cmd-output">${outputHtml}</div>
  `;
  termHistory.appendChild(entry);
  scrollToBottom();
}

/* ============================================================
   WELCOME
============================================================ */
function printWelcome() {
  const topPicks = PROJECTS.slice(0, 2).map(renderProjectCard).join('');

  const html = `
    <section class="hero">
      <div class="hero-eyebrow">// ADDIS ABABA · ETHIOPIA</div>
      <h1 class="hero-name">${esc(CFG.name)}</h1>
      <div class="hero-role">${esc(CFG.role)} · ${esc(CFG.education.school)}</div>
      <p class="hero-tagline">${esc(CFG.tagline)}</p>
      <div class="hero-status">
        <span class="status-dot"></span>
        <span>${esc(CFG.availabilityShort || CFG.availability)}</span>
      </div>
    </section>

    <div class="section-header">
      <h2 class="section-title">Featured Projects</h2>
      <button class="link-btn" onclick="runCmd('projects')">View all (${PROJECTS.length}) →</button>
    </div>

    <div class="project-grid">${topPicks}</div>

    <p class="welcome-hint">
      Type <kbd>help</kbd> for all commands, or use the quick actions below.
    </p>
  `;

  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  termHistory.appendChild(wrap);
}

/* ============================================================
   COMMANDS
============================================================ */
function cmdHelp() {
  const items = [
    ['about',    'Background, education, and availability'],
    ['projects', 'All featured projects (alias: ls)'],
    ['stack',    'Core technical stack (alias: skills)'],
    ['contact',  'Email, GitHub, LinkedIn, resume'],
    ['cv',       'Open my CV in a new tab'],
    ['clear',    'Clear the screen'],
  ];
  return `
    <div class="help-grid">
      ${items.map(([cmd, desc]) => `
        <button class="help-cmd" onclick="runCmd('${cmd}')">${cmd}</button>
        <span class="help-desc">${desc}</span>
      `).join('')}
    </div>
    <p class="help-tip">Tip: <code>open &lt;slug&gt;</code> shows full project details (e.g. <code>open feedwise</code>).</p>
  `;
}

function cmdAbout() {
  return `
    <p class="cmd-lead">
      I am a <strong>${esc(CFG.role)}</strong> at
      <strong>${esc(CFG.education.school)}</strong>
      (${esc(CFG.education.degree)}), based in <strong>${esc(CFG.location)}</strong>.
    </p>
    <p class="cmd-sub">
      I focus on backend-leaning full-stack architecture: multi-tenant SaaS platforms,
      payment and email pipelines, background worker queues with BullMQ and Redis,
      and reliable relational databases.
    </p>
    <div class="info-panel">
      <p><span class="info-label">Education</span>${esc(CFG.education.school)} — ${esc(CFG.education.degree)} (${esc(CFG.education.period)})</p>
      <p><span class="info-label">Location</span>${esc(CFG.location)}</p>
      <p><span class="info-label">Status</span><span style="color:var(--green)">${esc(CFG.availability)}</span></p>
    </div>
  `;
}

function cmdProjects() {
  if (!PROJECTS.length) return '<p class="cmd-intro">No projects configured.</p>';
  return `<div class="project-grid">${PROJECTS.map(renderProjectCard).join('')}</div>`;
}

function cmdOpen(slug) {
  if (!slug) {
    return '<p style="color:var(--red);">Usage: open &lt;slug&gt; (e.g. <code>open feedwise</code>)</p>';
  }
  const p = PROJECTS.find(x => x.slug.toLowerCase() === slug.toLowerCase());
  if (!p) {
    return `<p style="color:var(--red);">Project "${esc(slug)}" not found. Run <button class="help-cmd" onclick="runCmd('projects')">projects</button> for the list.</p>`;
  }

  const st = p.status || 'stable';
  const tags = (p.stack || []).map(t => `<span class="stack-tag">${esc(t)}</span>`).join('');
  const highlights = (p.highlights || []).map(h => `<li>${esc(h)}</li>`).join('');
  const actions = [];
  if (p.url)  actions.push(`<a class="proj-link live" href="${esc(p.url)}" target="_blank" rel="noopener">● Live Demo ↗</a>`);
  if (p.repo) actions.push(`<a class="proj-link repo" href="${esc(p.repo)}" target="_blank" rel="noopener">GitHub ↗</a>`);

  return `
    <div class="detail-card">
      <div class="detail-head">
        <span class="detail-name">${esc(p.name)}</span>
        <span class="detail-year">${esc(p.year)}</span>
        <span class="proj-status ${st}">${esc(st)}</span>
      </div>
      <p class="detail-outcome">${esc(p.outcome || p.blurb)}</p>
      <p class="detail-desc">${esc(p.desc || '')}</p>
      ${highlights ? `<h4 class="detail-h4">Highlights</h4><ul class="detail-highlights">${highlights}</ul>` : ''}
      <div class="proj-stack">${tags}</div>
      <div class="proj-links" style="margin-top:14px;">${actions.join('')}</div>
    </div>
  `;
}

function cmdStack() {
  const s = CFG.skills || {};
  const rows = [
    { key: 'Languages',    val: s.languages },
    { key: 'Backend',      val: s.backend },
    { key: 'Database',     val: s.database },
    { key: 'Frontend',     val: s.frontend },
    { key: 'Cloud & Ops',  val: s.cloud_ops },
    { key: 'Integrations', val: s.integrations },
  ].filter(r => r.val);

  if (!rows.length) {
    return '<p class="cmd-intro">No skills configured.</p>';
  }

  return `
    <div class="spec-list">
      ${rows.map(r => `
        <div class="spec-row">
          <span class="spec-key">${esc(r.key)}</span>
          <span class="spec-val">${esc(r.val)}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function cmdContact() {
  return `
    <p class="cmd-intro">Email is the fastest way to reach me.</p>
    <div class="spec-list">
      <div class="spec-row">
        <span class="spec-key">Email</span>
        <span class="spec-val"><a class="contact-link primary" href="mailto:${esc(CFG.email)}">${esc(CFG.email)}</a></span>
        <button class="copy-btn" onclick="copyEmail(this)">Copy</button>
      </div>
      <div class="spec-row">
        <span class="spec-key">GitHub</span>
        <span class="spec-val"><a class="contact-link" href="${esc(CFG.github)}" target="_blank" rel="noopener">${esc(CFG.githubLabel)}<span class="arr">↗</span></a></span>
      </div>
      <div class="spec-row">
        <span class="spec-key">LinkedIn</span>
        <span class="spec-val"><a class="contact-link" href="${esc(CFG.linkedin)}" target="_blank" rel="noopener">${esc(CFG.linkedinLabel)}<span class="arr">↗</span></a></span>
      </div>
      <div class="spec-row">
        <span class="spec-key">Resume</span>
        <span class="spec-val"><a class="contact-link" href="${esc(CFG.cv)}" target="_blank" rel="noopener">${esc(CFG.cvLabel)}<span class="arr">↗</span></a></span>
      </div>
    </div>
  `;
}

function cmdCv() {
  try { window.open(CFG.cv, '_blank', 'noopener'); } catch (e) {}
  return `<p class="cmd-intro">Opening CV (<a class="contact-link" href="${esc(CFG.cv)}" target="_blank" rel="noopener">${esc(CFG.cvLabel)}<span class="arr">↗</span></a>)…</p>`;
}

/* ============================================================
   DISPATCHER
============================================================ */
function runCmd(raw) {
  const line = (raw || '').trim();
  if (!line) return;

  cmdHistory.push(line);
  historyIndex = cmdHistory.length;

  const parts = line.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');

  if (cmd === 'clear') {
    termHistory.innerHTML = '';
    if (window.history && history.replaceState) {
      history.replaceState(null, '', window.location.pathname);
    }
    termInput.value = '';
    return;
  }

  if (['about', 'projects', 'stack', 'contact'].includes(cmd) && window.history && history.replaceState) {
    history.replaceState(null, '', '#' + cmd);
  }

  let out;
  switch (cmd) {
    case 'help':      out = cmdHelp();     break;
    case 'about':
    case 'whoami':    out = cmdAbout();    break;
    case 'projects':
    case 'ls':        out = cmdProjects(); break;
    case 'open':
    case 'project':
    case 'cat':       out = cmdOpen(arg);  break;
    case 'stack':
    case 'skills':    out = cmdStack();    break;
    case 'contact':
    case 'email':     out = cmdContact();  break;
    case 'cv':        out = cmdCv();       break;
    default:
      out = `<p style="color:var(--red);">command not found: <code>${esc(cmd)}</code>. Type <button class="help-cmd" onclick="runCmd('help')">help</button> for available commands.</p>`;
  }

  printEntry(line, out);
}

/* ============================================================
   INPUT EVENTS
============================================================ */
termInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = termInput.value;
    termInput.value = '';
    runCmd(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      termInput.value = cmdHistory[historyIndex] || '';
    }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex < cmdHistory.length - 1) {
      historyIndex++;
      termInput.value = cmdHistory[historyIndex] || '';
    } else {
      historyIndex = cmdHistory.length;
      termInput.value = '';
    }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = termInput.value.trim().toLowerCase();
    const cmds = ['help', 'about', 'projects', 'stack', 'contact', 'cv', 'clear'];
    const slugs = PROJECTS.map(p => p.slug);

    if (val.startsWith('open ')) {
      const prefix = val.slice(5).trim();
      const match = slugs.find(s => s.startsWith(prefix));
      if (match) termInput.value = 'open ' + match;
    } else if (val) {
      const match = cmds.find(c => c.startsWith(val));
      if (match) termInput.value = match;
    }
  }
});

/* Click-to-focus is disabled on touch — the tap-to-focus input handles it naturally */
termBody.addEventListener('click', maybeFocus);

/* ============================================================
   INIT
============================================================ */
printWelcome();
focusInput();

/* Deep links: #about, #projects, #stack, #contact, #cv */
if (typeof window !== 'undefined' && window.addEventListener) {
  const handleHash = () => {
    const hash = (window.location.hash || '').replace('#', '').trim().toLowerCase();
    if (hash && ['about', 'projects', 'stack', 'contact', 'cv'].includes(hash)) {
      runCmd(hash);
    }
  };
  window.addEventListener('DOMContentLoaded', handleHash);
  window.addEventListener('hashchange', handleHash);
}
</script>
</body>
</html>
