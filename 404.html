<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>404 — Page Not Found · Endalkachew Yaregal</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a0c0a">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0c0a;
  --surface: #0e110e;
  --border: #232b23;
  --ink-bright: #f4f7f4;
  --ink: #d8dfd8;
  --muted: #94a494;
  --accent: #ffc233;
  --red: #f87171;
  --green: #4ade80;
  --blue: #60a5fa;
  --mono: 'JetBrains Mono', monospace;
  --pixel: 'Space Mono', monospace;
}
html, body {
  height: 100%;
  background: var(--bg);
  background-image: radial-gradient(circle at center, #121612 1px, transparent 1px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--mono);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.terminal-window {
  width: 100%;
  max-width: 620px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.terminal-header {
  background: #080a08;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot.red { background: #f87171; }
.dot.yellow { background: #facc15; }
.dot.green { background: #4ade80; }
.title {
  margin-left: 8px;
  font-size: 13px;
  color: var(--muted);
  font-family: var(--pixel);
}
.terminal-body {
  padding: 24px 20px;
  font-size: 15px;
  line-height: 1.6;
}
.prompt {
  color: var(--blue);
  margin-bottom: 12px;
}
.prompt .cmd {
  color: var(--ink-bright);
}
.error-msg {
  color: var(--red);
  margin-bottom: 16px;
}
.desc {
  color: var(--muted);
  margin-bottom: 24px;
}
.home-btn {
  display: inline-block;
  background: var(--accent);
  color: #000;
  font-family: var(--pixel);
  font-weight: 700;
  font-size: 14px;
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 4px;
  transition: opacity 0.15s ease;
}
.home-btn:hover {
  opacity: 0.9;
}
.redirect-hint {
  margin-top: 16px;
  font-size: 12px;
  color: var(--muted);
}
</style>
</head>
<body>

<div class="terminal-window">
  <div class="terminal-header">
    <span class="dot red"></span>
    <span class="dot yellow"></span>
    <span class="dot green"></span>
    <span class="title">endalk@dev-box: 404</span>
  </div>
  <div class="terminal-body">
    <div class="prompt">
      visitor@dev-box:~$ <span class="cmd" id="req-cmd">cat destination</span>
    </div>
    <div class="error-msg">
      error: 404 — resource not found.
    </div>
    <p class="desc">
      The requested path does not exist on this dev box or has been moved.
    </p>
    <a href="/" class="home-btn">← Return to Terminal</a>
    <div class="redirect-hint">Redirecting automatically in <span id="timer">6</span>s…</div>
  </div>
</div>

<script>
  try {
    const path = window.location.pathname;
    if (path && path !== '/') {
      document.getElementById('req-cmd').textContent = 'cat ' + path;
    }
  } catch (e) {}

  let sec = 6;
  const timerEl = document.getElementById('timer');
  const interval = setInterval(() => {
    sec--;
    if (timerEl) timerEl.textContent = sec;
    if (sec <= 0) {
      clearInterval(interval);
      window.location.href = '/';
    }
  }, 1000);
</script>
</body>
</html>
