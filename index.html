<style>
/* ============ instrument of thought ============ */
:root{
  --bg:#0b0a09;
  --surface:#121110;
  --surface2:#181614;
  --ink:#ebe6df;
  --sub:#9a938a;
  --faint:#857e74;
  --hair:rgba(235,230,223,.08);
  --hair2:rgba(235,230,223,.045);
  --fill:rgba(235,230,223,.035);
  --fill2:rgba(235,230,223,.06);
  --accent:#c9a66b;
  --accent-soft:rgba(201,166,107,.12);
  --accent-dim:rgba(201,166,107,.35);
  --err:#d46a5c;
  --amber:#c9a66b;
  --ok:#8faf7a;
  --sans:'Hanken Grotesk',-apple-system,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.25,.8,.25,1);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:15.5px/1.55 var(--sans);
  display:grid; grid-template-rows:auto minmax(0,1fr) auto; grid-template-columns:minmax(0,1fr);
  height:100vh; height:100dvh; overflow:hidden;
  -webkit-font-smoothing:antialiased;
  /* quiet paper grain */
  background-image:
    radial-gradient(ellipse 120% 80% at 50% -20%, rgba(201,166,107,.04), transparent 55%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
}
::selection{background:var(--accent);color:#1a1612}
:focus-visible{outline:1.5px solid var(--accent-dim);outline-offset:3px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(235,230,223,.1);border:2px solid var(--bg);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(235,230,223,.2)}
button{font:inherit;color:inherit;cursor:pointer}
code,pre,kbd{font-family:var(--mono)}

/* ============ app chrome ============ */
#sb{
  display:flex;align-items:center;gap:4px;height:48px;
  padding:0 clamp(14px,2.5vw,22px);
  background:var(--surface);
  border-bottom:1px solid var(--hair);
  z-index:20; user-select:none;
}
.brand{
  display:flex;align-items:center;gap:10px;
  background:none;border:0;padding:7px 10px;border-radius:var(--r);
}
.brand:hover{background:var(--fill)}
.brand-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);flex:none;
  box-shadow:0 0 0 3px var(--accent-soft);
}
.brand-name{font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink)}
#sb-path{font:11.5px var(--mono);color:var(--faint);margin-left:4px;letter-spacing:.02em}
.sb-nav{display:flex;align-items:center;gap:1px;margin-left:12px;flex:1;overflow-x:auto;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.sb-win{
  background:none;border:0;color:var(--faint);
  font-size:13px;font-weight:500;padding:7px 12px;border-radius:8px;
  white-space:nowrap;transition:color .15s,background .15s;letter-spacing:.01em;
}
.sb-win:hover{color:var(--ink);background:var(--fill)}
.sb-win.active{color:var(--ink);background:var(--fill2)}
.sb-right{display:flex;align-items:center;gap:16px;font:11.5px var(--mono);color:var(--faint);white-space:nowrap;letter-spacing:.02em}
#sb-clock{color:var(--sub);font-variant-numeric:tabular-nums}

/* ============ content ============ */
#view{overflow-y:auto;min-height:0;position:relative}
#page{
  max-width:920px;margin:0 auto;
  padding:clamp(40px,8vh,96px) clamp(20px,5vw,48px) 120px;
  transition:opacity .28s var(--ease),transform .28s var(--ease);
}
#page.out{opacity:0;transform:translateY(10px)}
.kicker{
  font:11.5px var(--mono);color:var(--faint);
  margin-bottom:20px;letter-spacing:.04em;text-transform:lowercase;
}
.kicker .t-user{color:var(--accent)}
.kicker .k-dim{color:var(--faint)}
.display{
  font-weight:500;font-size:clamp(40px,6.2vw,78px);
  line-height:1.05;letter-spacing:-.03em;color:var(--ink);
}
.hcaret{
  display:inline-block;width:3px;height:.78em;border-radius:1px;
  background:var(--accent);margin-left:.12em;transform:translateY(.05em);
  animation:blink 1.2s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
.display-2{
  font-weight:500;font-size:clamp(28px,3.8vw,44px);
  line-height:1.08;letter-spacing:-.025em;margin:4px 0 36px;max-width:16ch;
  color:var(--ink);
}
.lede{
  font-size:clamp(15px,1.4vw,17.5px);line-height:1.6;
  color:var(--sub);max-width:38ch;margin-top:24px;font-weight:400;
}

/* ============ buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:550;letter-spacing:.01em;
  padding:11px 22px;border-radius:8px;border:0;
  transition:background .15s,color .15s,border-color .15s,transform .1s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#0b0a09}
.btn-primary:hover{background:#fff}
.btn-ghost{
  background:transparent;color:var(--sub);
  border:1px solid var(--hair);font:500 12.5px var(--mono);
}
.btn-ghost:hover{color:var(--ink);border-color:rgba(235,230,223,.16);background:var(--fill)}
.btn-small{padding:9px 16px;font:500 12px var(--mono)}

/* ============ hero ============ */
.hero{
  display:flex;flex-direction:column;justify-content:center;
  min-height:clamp(380px,calc(100dvh - 220px),720px);
  max-width:42rem;
}
.hero-name{
  font:12.5px var(--mono);color:var(--accent);letter-spacing:.04em;
  margin-bottom:14px;font-weight:500;
}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.hero-meta{font:11.5px var(--mono);color:var(--faint);margin-top:28px;line-height:1.8;letter-spacing:.03em}
.hero-meta b{color:var(--accent);font-weight:400;padding:0 8px}
.hero-avail{color:var(--sub);margin-top:10px}
.scan{
  margin-top:40px;padding-top:28px;border-top:1px solid var(--hair);
  max-width:36rem;
}
.scan-h{font:11px var(--mono);color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.scan-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.scan-list li{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;
  align-items:baseline;font-size:14px;
}
.scan-list button{
  background:none;border:0;padding:0;text-align:left;
  color:var(--ink);font-weight:550;letter-spacing:-.01em;
  border-bottom:1px solid transparent;transition:color .15s,border-color .15s;
}
.scan-list button:hover{color:var(--accent);border-bottom-color:var(--accent-dim)}
.scan-out{font:12px var(--mono);color:var(--sub);text-align:right;max-width:28ch}
.p-out{
  font:12.5px var(--mono);color:var(--accent);margin:10px 8px 0;
  letter-spacing:.01em;line-height:1.5;max-width:60ch;
}
.p-links{display:flex;flex-wrap:wrap;gap:10px;margin:0 8px 18px;padding-top:4px}
.p-links a{
  font:12px var(--mono);color:var(--sub);text-decoration:none;
  border:1px solid var(--hair);padding:6px 12px;border-radius:6px;
  background:var(--surface);transition:color .12s,border-color .12s;
}
.p-links a:hover{color:var(--accent);border-color:var(--accent-dim)}

/* ============ about ============ */
.about-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:clamp(32px,5vw,64px)}
.prose p{font-size:15.5px;line-height:1.7;color:var(--sub);margin-bottom:1.25em;max-width:48ch}
.prose p strong{color:var(--ink);font-weight:600}
.prose p:last-child{margin-bottom:0}
.facts-h,.pr-h,.toml-h{font:11px var(--mono);color:var(--faint);margin:0 0 12px 4px;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.facts{
  border:1px solid var(--hair);border-radius:var(--r);
  background:var(--surface);overflow:hidden;
}
.fact{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:12px 16px;border-bottom:1px solid var(--hair2);font-size:14px;
}
.fact:last-child{border-bottom:0}
.fact dt{color:var(--sub)}
.fact dd{font:12.5px var(--mono);color:var(--ink);text-align:right;letter-spacing:.01em}
.fact-hot dd{color:var(--accent);font-weight:500}

/* ============ projects ============ */
.proj-list{border-top:1px solid var(--hair)}
.proj{border-bottom:1px solid var(--hair)}
.proj-row{
  width:100%;display:grid;
  grid-template-columns:2.8ch minmax(0,auto) 1fr max-content 18px;
  gap:8px 20px;align-items:center;padding:20px 8px;
  background:none;border:0;text-align:left;border-radius:8px;
  transition:background .15s;
}
.proj-row:hover{background:var(--fill)}
.p-idx{font:11.5px var(--mono);color:var(--faint);transition:color .15s;letter-spacing:.02em}
.proj-row:hover .p-idx{color:var(--accent)}
.p-name{font-size:clamp(18px,2.2vw,23px);font-weight:550;letter-spacing:-.015em;transition:color .15s}
.proj-row:hover .p-name{color:var(--accent)}
.p-blurb{font-size:13.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-year{font:11.5px var(--mono);color:var(--faint);letter-spacing:.02em}
.p-caret{display:flex;align-items:center;justify-content:center;color:var(--faint);transition:transform .4s var(--ease),color .15s}
.proj.open .p-caret{transform:rotate(180deg);color:var(--accent)}
.proj-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.proj.open .proj-body{grid-template-rows:1fr}
.proj-inner{overflow:hidden;min-height:0}
.p-desc{font-size:14.5px;line-height:1.65;color:var(--sub);max-width:52ch;padding:4px 8px 0}
.p-status{display:flex;align-items:center;gap:8px;font:11.5px var(--mono);color:var(--faint);margin:16px 0 4px;padding:0 8px;letter-spacing:.03em}
.st-dot{width:6px;height:6px;border-radius:50%;flex:none}
.st-live{background:var(--ok)} .st-stable{background:var(--accent)} .st-archived{background:var(--faint)}
.p-high{list-style:none;margin:12px 0 18px;padding:0 8px}
.p-high li{font-size:13.5px;color:var(--sub);padding:4px 0 4px 16px;position:relative}
.p-high li::before{content:'·';position:absolute;left:2px;color:var(--accent);font-family:var(--mono)}
.p-tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:0 8px}
.tag{
  font:11px var(--mono);color:var(--sub);border:1px solid var(--hair);
  background:var(--surface);padding:4px 10px;border-radius:6px;letter-spacing:.02em;
}
.list-hint{font:12px var(--mono);color:var(--faint);margin-top:24px;letter-spacing:.02em}
.inline-cmd{
  background:none;border:0;border-bottom:1px dashed var(--accent-dim);
  color:var(--accent);padding:0 1px;font:inherit;cursor:pointer;
}
.inline-cmd:hover{color:#d4b87e}

/* ============ stack ============ */
.toml{
  font:13px/1.9 var(--mono);
  background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);
  padding:24px 28px;overflow-x:auto;white-space:pre;
  width:max-content;max-width:100%;min-width:min(100%,480px);
}
.tk-sec{color:var(--ink);font-weight:600}
.tk-k{color:var(--sub)} .tk-v{color:#c8c2b8} .tk-o{color:var(--faint)}
.tk-c{color:var(--faint);font-style:italic}
.principles{list-style:none;max-width:520px;margin-top:14px;border-top:1px solid var(--hair)}
.principles li{
  font-size:15px;color:var(--sub);padding:14px 2px 14px 22px;
  border-bottom:1px solid var(--hair2);position:relative;
}
.principles li::before{content:'—';position:absolute;left:0;color:var(--accent);font-family:var(--mono);font-size:13px}

/* ============ contact ============ */
.mail-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:36px 0 12px}
.mail-row code{
  font:500 14px var(--mono);background:var(--surface);border:1px solid var(--hair);
  padding:13px 18px;border-radius:var(--r);color:var(--ink);letter-spacing:.01em;
}
.links{list-style:none;max-width:560px;border-top:1px solid var(--hair);margin-top:12px}
.links a{
  display:flex;align-items:center;gap:16px;padding:14px 6px;
  border-bottom:1px solid var(--hair2);color:var(--ink);text-decoration:none;
  font-size:14.5px;transition:background .12s;border-radius:8px;
}
.links a:hover{background:var(--fill)}
.l-k{color:var(--sub);font-size:13.5px}
.l-v{margin-left:auto;font:12.5px var(--mono);color:var(--sub);letter-spacing:.01em}
.l-v i{font-style:normal;color:var(--faint);margin-left:6px;transition:transform .18s var(--ease),color .18s;display:inline-flex}
.links a:hover .l-v i{transform:translateX(3px);color:var(--accent)}
.hint{font:12.5px var(--mono);color:var(--sub);margin-top:28px;letter-spacing:.02em}
.colophon{
  margin-top:72px;padding-top:20px;border-top:1px solid var(--hair2);
  font:11.5px var(--mono);color:var(--faint);text-align:center;letter-spacing:.04em;
}

/* ============ terminal sheet ============ */
#dock{
  background:var(--surface2);border-top:1px solid var(--hair);
  border-radius:14px 14px 0 0;display:flex;flex-direction:column;flex:none;
  position:relative;z-index:15;
  box-shadow:0 -16px 48px rgba(0,0,0,.45);
}
#dock-head{
  height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--hair2);font:11px var(--mono);color:var(--faint);
  cursor:ns-resize;user-select:none;touch-action:none;
  background:var(--surface);border-radius:14px 14px 0 0;letter-spacing:.03em;
}
.tty-dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;
  animation:pulse 2.6s ease-in-out infinite;
}
@keyframes pulse{50%{opacity:.35}}
.tty-label{color:var(--sub)}
.tty-hint{margin-left:auto;white-space:nowrap}
.tty-hint b{color:var(--accent);font-weight:500}
#dock-toggle{background:none;border:0;color:var(--faint);cursor:pointer;padding:5px;margin-left:6px;display:flex;transition:color .12s}
#dock-toggle:hover{color:var(--ink)}
#dock.collapsed #dock-body{display:none}
#dock-body{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 14px;font:12.5px/1.6 var(--mono);position:relative}
#kbd{position:absolute;left:0;bottom:0;width:2px;height:2px;opacity:0;border:0;background:none;color:transparent;pointer-events:none;font-size:16px}
.t-line{white-space:pre-wrap;word-break:break-word;color:var(--ink);padding:1px 0}
.t-dim{color:var(--faint)} .t-faint{color:var(--faint)}
.t-acc{color:var(--accent)} .t-err{color:var(--err)} .t-ok{color:var(--ok)}
.t-user{color:var(--accent);font-weight:500} .t-path{color:var(--ink)} .t-cmd{color:var(--ink)}
.t-pre{font:inherit;margin:2px 0 4px;white-space:pre-wrap}
.help-row .t-acc{display:inline-block;min-width:14em}
#t-inline{white-space:pre-wrap}
#t-cur{
  display:inline-block;width:6px;height:1em;border-radius:1px;
  background:var(--accent);vertical-align:text-bottom;margin-left:1px;
  animation:blink 1.1s steps(1) infinite;
}
.fetch{display:flex;flex-wrap:wrap;gap:10px 28px;padding:6px 0 10px}
.fetch-art{font:11.5px/1.35 var(--mono);color:var(--accent);white-space:pre}
.fetch-info{font:12px/1.65 var(--mono)}
.fi-head{color:var(--accent);font-weight:600}
.fi-sep{color:var(--faint)}
.fi-k{display:inline-block;min-width:8em;color:var(--faint)}
.fi-hot{color:var(--accent)}

/* ============ crt ============ */
#crt{position:fixed;inset:0;pointer-events:none;z-index:99;opacity:0;transition:opacity .4s;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
body.crt #crt{opacity:1}

/* ============ responsive ============ */
@media (max-width:999px){
  .hero{min-height:clamp(360px,calc(100dvh - 220px),640px)}
}
@media (max-width:880px){ .about-grid{grid-template-columns:1fr} .sb-right #sb-up{display:none} }
@media (max-width:760px){
  .proj-row{grid-template-columns:2.8ch minmax(0,1fr) max-content 16px;gap:6px 14px}
  .p-blurb{grid-column:2 / -1;grid-row:2;white-space:normal;overflow:visible;text-overflow:clip;font-size:12.5px;line-height:1.45}
  .tty-hint{display:none}
  #sb-path{display:none}
  .toml{padding:18px 16px}
  .scan-list li{grid-template-columns:1fr;gap:4px}
  .scan-out{text-align:left;max-width:none}
  /* touch targets ≥44px */
  .scan-list button{padding:11px 0;min-height:44px}
  .sb-win{padding:12px 10px}
  .brand{padding:12px 10px}
  #dock-toggle{padding:14px 10px;min-width:44px;min-height:44px;justify-content:center;align-items:center;margin:-14px -6px -14px 4px}
}
@media (max-width:560px){ .sb-win{padding:12px 9px;font-size:12.5px} .brand-name{font-size:12.5px} #sb-clock{display:none} }
@media (max-height:820px){
  #page{padding-top:clamp(24px,5vh,44px)}
  .display{font-size:clamp(36px,4.6vw,60px)}
  .kicker{margin-bottom:12px}
  .lede{margin-top:16px}
  .hero-actions{margin-top:22px}
  .hero-meta{margin-top:20px}
  .hero-avail{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){
  .hcaret,#t-cur,.tty-dot{animation:none}
  #page,.proj-body,.p-caret{transition:none}
}
</style>
</head>
<body>
<div id="crt" aria-hidden="true"></div>
<!-- frosted menu bar: brand = home, items type real commands -->
<header id="sb">
  <button class="brand" id="sb-brand" title="cd ~">
    <span class="brand-dot" aria-hidden="true"></span>
    <span class="brand-name">dev@dev-box</span><span id="sb-path">~</span>

    case 'cd': cdCmd(args); break;
